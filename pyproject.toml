[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymc-monitor"
version = "0.1.0"
description = "Local streaming convergence diagnostics and adaptive stopping for PyMC"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Spencer Boucher"}]
dependencies = ["pymc>=5.28,<7", "arviz>=0.17,<2", "numpy>=1.24,<2.5", "rich>=13"]

[project.optional-dependencies]
notebook = ["anywidget>=0.9", "ipython>=8"]
dashboard = []
nutpie = ["nutpie>=0.13"]
jax = ["jax", "numpyro", "blackjax"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1", "nutpie>=0.13", "h5netcdf>=1.3", "h5py>=3", "anywidget>=0.9", "ipython>=8", "ipykernel>=6", "nbformat>=5", "nbclient>=0.10"]
docs = ["quartodoc>=0.11,<0.12", "griffe<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/pymc_monitor"]

[tool.hatch.build.targets.sdist]
include = ["src/pymc_monitor", "tests", "scripts", "docs", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "AGENTS.md", "pyproject.toml", "uv.lock", "package.json", "package-lock.json", "playwright.config.js"]
exclude = [".extraction-source/**", "docs/_site/**", "docs/.quarto/**", "**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pymc_monitor"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
