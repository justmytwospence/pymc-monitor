name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --no-config --locked --group dev --group docs --extra dashboard
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync pytest -q --cov=pymc_monitor --cov-fail-under=85
      - run: uv run --no-sync python scripts/check_version.py
      - run: uv run --no-sync python -m build
      - run: uv run --no-sync python scripts/check_artifact.py
      - name: Smoke test the wheel and source distribution
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv venv .smoke --clear
            uv pip install --python .smoke/bin/python "${artifact}[dashboard]"
            .smoke/bin/python scripts/smoke.py
            .smoke/bin/python scripts/smoke_dashboard.py
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
